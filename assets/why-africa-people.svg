<text x="80" y="125" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">WHY AFRICA</text>
<text x="80" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="700">Our greatest resource</text>
<text x="80" y="250" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="700">is its people.</text>
<text x="80" y="310" fill="#e5f1ff" font-family="Arial,sans-serif" font-size="24">Potential becomes progress when people are equipped</text>
<text x="80" y="345" fill="#e5f1ff" font-family="Arial,sans-serif" font-size="24">to think, create, lead and build together.</text>
